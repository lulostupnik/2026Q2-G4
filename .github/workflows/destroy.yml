name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribir "destroy" para confirmar'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_VERSION: 1.16.6
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: us-east-1

defaults:
  run:
    shell: bash

jobs:
  destroy:
    name: destroy
    runs-on: ubuntu-latest
    if: inputs.confirm == 'destroy'
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verificar credenciales
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::Faltan los secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY y AWS_SESSION_TOKEN."
            exit 1
          fi
          aws sts get-caller-identity --query Arn --output text

      - name: destroy
        run: make destroy DESTROY_FLAGS=-auto-approve
